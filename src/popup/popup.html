<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 260px;
      margin: 0;
      font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #fff;
      color: #0f1419;
    }
    .pop {
      padding: 16px;
    }
    h3 {
      margin: 0 0 10px;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      display: inline-block;
    }
    .dot.ok {
      background: #00a854;
    }
    .dot.err {
      background: #dc3c3c;
    }
    p {
      font-size: 13px;
      color: #536471;
      line-height: 1.5;
      margin: 0 0 12px;
    }
    button {
      width: 100%;
      border: 1px solid #1d9bf0;
      background: #1d9bf0;
      color: #fff;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover {
      background: #1a8cd8;
    }
    .url {
      font-size: 12px;
      color: #536471;
      word-break: break-all;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="pop">
    <h3><span id="dot" class="dot"></span>Quick AI Reply</h3>
    <p id="status">检查配置中…</p>
    <button id="openSettings">打开设置</button>
    <div class="url" id="currentTab"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
